services:
  waf:
    build: .
    image: owasp/modsecurity-crs:nginx
    container_name: waf-modsecurity
    ports:
      - "8000:8080"
    environment:
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - BACKEND=http://dvwa-app:80
      - MODSEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/var/log/nginx/modsec_audit.log
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - MODSEC_AUDIT_ENGINE=RelevantOnly
    volumes:
      - ./logs:/var/log/nginx
    networks:
      - red-waf
    restart: always

networks:
  red-waf:
    external: true
