services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ave-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  gophish:
    image: gophish/gophish:latest
    container_name: ave-gophish
    restart: unless-stopped
    ports:
      - "3333:3333"
      - "8080:80"
    depends_on:
      - mailhog
